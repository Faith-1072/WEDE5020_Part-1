<!DOCTYPE html>
<html>
<head>
    <title>Wig Enquiries | Contact Glamoured South Africa</title>

<meta name="description" content="Have questions about Glamoured wigs or hair products? Send us an enquiry and let us help you find your perfect style.">

<meta name="keywords" content="wig enquiries, wig information South Africa, Glamoured contact, hair product enquiries">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Glamoured</h1>
    <p>Bold, daring and simply stunning!</p>
</header>

<nav>
    <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="enquiry.html">Enquiry</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<main>

    <section class="enquiry">
        <h2>Make an Enquiry</h2>

        <p>
            Interested in our wigs or need more information?
            Complete the form below and we will get back to you.
        </p>

            <form id="enquiryForm" 
                  action="https://formsubmit.co/ajax/faithmabje@icloud.com"
                  method="POST">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">

            <label for="product">Product Interest:</label>
            <select id="product" name="product">
                <option value="">Select a product</option>
                <option value="straight">Straight Wigs</option>
                <option value="curly">Curly Wigs</option>
                <option value="hair-care">Hair Care Tips</option>
            </select>

            <label for="message">Your Enquiry:</label>
            <textarea id="message" name="message" rows="5"></textarea>

            <button type="submit">Submit Enquiry</button>
            <p id="enquiryFeedback" role="status"></p>
        </form>
    </section>

</main>

<footer>
    <p>&copy; 2026 Glamoured. All rights reserved.</p>
</footer>

    <script src="script.js"></script>
</body>
</html>
